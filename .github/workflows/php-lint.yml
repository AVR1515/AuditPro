name: Verificación PHP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis PHP
        run: |
          set -e
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verificar migración de solicitudes
        run: |
          test -s private/upgrade-010.sql
          grep -q "upgrade-010.sql" public/install.php
          grep -q "upgrade-011.sql" public/install.php
          grep -q "upgrade-012.sql" public/install.php
          grep -q "upgrade-013.sql" public/install.php
          grep -q "upgrade-014.sql" public/install.php
          grep -q "upgrade-015.sql" public/install.php
          grep -q "upgrade-016.sql" public/install.php
          grep -q "upgrade-017.sql" public/install.php
          grep -q "kri.php" public/index.php
          grep -q "multiyear.php" public/index.php
          grep -q "exceptions.php" public/index.php
          grep -q "attestations.php" public/index.php
          grep -q "risk-acceptance.php" public/index.php
          grep -q "capacity.php" public/index.php
          grep -q "templates.php" public/index.php
          grep -q "requests.php" public/index.php
  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: auditpro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: Verificar flujos con MySQL temporal
        env:
          AUDITPRO_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=auditpro_test;charset=utf8mb4
          AUDITPRO_TEST_USER: root
          AUDITPRO_TEST_PASSWORD: testpass
        run: php tests/smoke.php
